name: Build Android APK (MiVoz)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build MiVoz APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 3. Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: 4. Accept Android SDK Licenses & Install Android Platforms
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" "platforms;android-35" "build-tools;35.0.0" || true

      - name: 5. Install Node Dependencies
        run: npm ci

      - name: 6. Verify or Fetch Local Voice Model (Fallback)
        run: |
          mkdir -p public/piper
          if [ ! -f "public/piper/es_MX-ald-medium.onnx" ] || [ $(wc -c < "public/piper/es_MX-ald-medium.onnx" 2>/dev/null || echo 0) -lt 1000000 ]; then
            echo "Obteniendo binario es_MX-ald-medium.onnx..."
            curl -L -o public/piper/es_MX-ald-medium.onnx "https://huggingface.co/rhasspy/piper-voices/resolve/main/es/es_MX/ald/medium/es_MX-ald-medium.onnx"
          fi
          if [ ! -f "public/piper/es_MX-ald-medium.onnx.json" ]; then
            curl -L -o public/piper/es_MX-ald-medium.onnx.json "https://huggingface.co/rhasspy/piper-voices/resolve/main/es/es_MX/ald/medium/es_MX-ald-medium.onnx.json"
          fi

      - name: 7. Build Web Production Bundle (dist)
        run: npm run build

      - name: 8. Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: 9. Sync Capacitor to Android
        run: |
          mkdir -p android/app/src/main/assets
          npx cap sync android

      - name: 10. Build Debug APK with Gradle
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log || {
            echo "::error::Gradle assembleDebug failed. Last 40 lines:"
            tail -n 40 build.log
            exit 1
          }

      - name: 11. Prepare Artifact
        run: |
          mkdir -p build-output
          echo "Buscando archivos APK generados..."
          find android -name "*.apk"
          APK_FILE=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find android -name "*.apk" | head -n 1)
          fi
          if [ -n "$APK_FILE" ]; then
            cp "$APK_FILE" build-output/MiVoz.apk
            echo "APK copiado exitosamente: $APK_FILE -> build-output/MiVoz.apk"
            ls -lh build-output/MiVoz.apk
          else
            echo "Error: No se encontró ningún archivo APK generado."
            find android -type d -name "outputs" -exec ls -laR {} + || true
            exit 1
          fi

      - name: 12. Upload MiVoz-apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiVoz-apk
          path: build-output/MiVoz.apk
          if-no-files-found: error
          retention-days: 30

      - name: 13. Upload Gradle Build Log (Diagnostic)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: android/build.log
          if-no-files-found: ignore
